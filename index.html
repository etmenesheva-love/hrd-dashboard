function extractStaffPercents(text) {
  // "укомплектованность копакинга 95,6% ... укомплектованность собственное производство 85% ..."
  if (!text) return { kop: null, own: null };
  const t = text.replace(/,/g, '.');
  let kop = null, own = null;
  let m = t.match(/копакинг[а-яё\s]*?([\d]+(?:\.\d+)?)\s*%/i);
  if (m) kop = parseFloat(m[1]);
  m = t.match(/собственн[а-яё\s]*производств[а-яё\s]*?([\d]+(?:\.\d+)?)\s*%/i);
  if (m) own = parseFloat(m[1]);
  return { kop: kop, own: own };
}
function extractOutsourcePercents(text) {
  // "копакинг 100%, ... собственное производство 100%, ..."
  if (!text) return { kop: null, own: null };
  const t = text.replace(/,/g, '.');
  let kop = null, own = null;
  let m = t.match(/копакинг[а-яё\s]*?([\d]+(?:\.\d+)?)\s*%/i);
  if (m) kop = parseFloat(m[1]);
  m = t.match(/собственн[а-яё\s]*?производств[а-яё\s]*?([\d]+(?:\.\d+)?)\s*%/i);
  if (m) own = parseFloat(m[1]);
  return { kop: kop, own: own };
}
function extractOutputPlanFact(text) {
  // "копакинг план не менее 400 штук в день / факт 450 собственное производство план 600/факт 678"
  if (!text) return { kop: null, own: null };
  let kop = null, own = null;
  let m = text.match(/копакинг[\s\S]*?план[^\d]*([\d]+)[\s\S]*?факт[^\d]*([\d]+)/i);
  if (m) kop = { plan: parseInt(m[1]), fact: parseInt(m[2]) };
  m = text.match(/собственн[\s\S]*?план[^\d]*([\d]+)[\s\S]*?факт[^\d]*([\d]+)/i);
  if (m) own = { plan: parseInt(m[1]), fact: parseInt(m[2]) };
  return { kop: kop, own: own };
}
function pctClass(p) {
  if (p == null) return 'nodata';
  if (p >= 95) return 'green';
  if (p >= 85) return 'amber';
  return 'red';
}
function pctBar(label, pct, comment) {
  const cls = pctClass(pct);
  const w = pct == null ? 0 : Math.min(100, Math.max(0, pct));
  const valTxt = pct == null ? '—' : (Number.isInteger(pct) ? pct + '%' : pct.toFixed(1).replace('.', ',') + '%');
  return '<div class="pbar-block">' +
    '<div class="pbar-head"><span class="pbar-label">' + escapeHtml(label) + '</span><span class="pbar-val ' + cls + '">' + valTxt + '</span></div>' +
    '<div class="pbar-track"><div class="pbar-fill ' + cls + '" style="width:' + w + '%"></div></div>' +
    (comment ? '<div class="pbar-comment">' + escapeHtml(comment) + '</div>' : '') +
  '</div>';
}

function renderOnboardingBlock(onboardingText) {
  const ob = parseOnboarding(onboardingText);
  const inIS = ob.stats.inIS || 0;

  // Считаем АВ-распределение по дням ИС
  const today = new Date();
  let av1 = 0, av2 = 0, av3 = 0, doneIS = 0;
  (ob.people || []).forEach(function(p){
    if (!p.hired) return;
    const days = Math.floor((today - p.hired) / (1000 * 60 * 60 * 24));
    if (days < 0) return;
    if (days <= 30) av1++;
    else if (days <= 60) av2++;
    else if (days <= 90) av3++;
    else if (p.endIS) {
      const dleft = Math.floor((p.endIS - today) / (1000 * 60 * 60 * 24));
      if (dleft <= 0 && dleft >= -7) doneIS++;
    }
  });

  const newPeople = (ob.people || []).filter(function(p){
    if (!p.hired) return false;

      '<div class="ob-kpi"><div class="num">' + doneIS + '</div><div class="lbl">завершили ИС</div></div>' +

}

function projStatusClass(s){
  var t=(s||'').toLowerCase();
  if(/сделан|готов|закрыт|выполнен/.test(t)) return 'done';
  if(/работе|процесс/.test(t)) return 'work';
  return 'plan';
}
function renderProjectsBlock() {
  var blocks = PROJECTS_2026 || [];

  blocks.forEach(function(b){ (b.items||[]).forEach(function(p){
    total++; var c=projStatusClass(p.status);
    if(c==='done')done++; else if(c==='work')work++; else plan++;
  });});
  var kpis =
    '<div class="proj-kpis">' +

      '<div class="proj-kpi"><div class="n">' + done + '</div><div class="l">сделано</div></div>' +
      '<div class="proj-kpi"><div class="n">' + blocks.length + '</div><div class="l">владельцев</div></div>' +
    '</div>';
  var body = blocks.map(function(b){

    var rows=items.map(function(p){

      var label=p.status? p.status : 'план';
      var status='<span class="proj-status ' + cls + '">' + escapeHtml(label) + '</span>';

      return '<div class="proj-row">' +
        '<div style="flex:1;min-width:0;">' +
          '<div class="ptitle">' + escapeHtml(p.name||'—') + '</div>' +
          (goal? '<div class="pmeta">' + escapeHtml(goal) + '</div>' : '') +
        '</div>' +
        '<div class="pright">' + status + '</div>' +
      '</div>';
    }).join('');
    return '<div class="proj-owner">👤 ' + escapeHtml(b.owner) + '<span class="ocount">' + items.length + '</span></div>' + rows;
  }).join('');
  return '<div class="legacy-section">' +
    '<h2>📋 Проекты 2026 <span class="badge">' + total + ' проектов</span></h2>' +
    kpis + body +
  '</div>';
}

function renderISBlock(onboardingText) {
  const ob = parseOnboarding(onboardingText);
  const today = new Date();
  const peopleIS = (ob.people || []).filter(function(p){
    if (!p.endIS) return false;
    const days = Math.floor((p.endIS - today) / (1000 * 60 * 60 * 24));
    return days >= 0 && days <= 90;
  }).sort(function(a, b){ return a.endIS - b.endIS; });

  if (!peopleIS.length) {
    return '<div class="legacy-section"><h2>📅 Календарь · испытательный срок</h2><div class="empty">Никто не завершает ИС в ближайшие 90 дней</div></div>';
  }

  const week = [], month = [], quarter = [];
  peopleIS.forEach(function(p){
    const days = Math.floor((p.endIS - today) / (1000 * 60 * 60 * 24));
    if (days <= 7) week.push({ p: p, days: days });
    else if (days <= 30) month.push({ p: p, days: days });
    else quarter.push({ p: p, days: days });
  });

  function rowsHtml(arr) {
    return arr.map(function(it){
      return '<div class="is-row">' +
        '<div class="when">' + it.p.endIS.toLocaleDateString('ru-RU') + ' · через ' + it.days + ' дн.</div>' +
        '<div class="who">' + escapeHtml(it.p.fio || '—') + '</div>' +
        '<div class="role">' + escapeHtml(it.p.position || '') + '</div>' +
      '</div>';
    }).join('');
  }

  let html = '<div class="legacy-section"><h2>📅 Календарь · испытательный срок</h2>';
  html += '<div class="is-group-title">Эта неделя' + (week.length ? ' · ' + week.length : '') + '</div>';
  html += week.length ? rowsHtml(week) : '<div style="color:#b09870;font-size:12px;font-style:italic;">—</div>';
  html += '<div class="is-group-title">В течение месяца' + (month.length ? ' · ' + month.length : '') + '</div>';
  html += month.length ? rowsHtml(month) : '<div style="color:#b09870;font-size:12px;font-style:italic;">—</div>';
  html += '<div class="is-group-title">Через 1–3 месяца' + (quarter.length ? ' · ' + quarter.length : '') + '</div>';
  html += quarter.length ? rowsHtml(quarter) : '<div style="color:#b09870;font-size:12px;font-style:italic;">—</div>';
  html += '</div>';
  return html;
}

function renderReportsTab(activeMonth) {
  var month = activeMonth || 'july';
  var months = [
    { key: 'july',  label: 'Июль 2026' },
    { key: 'june',  label: 'Июнь 2026' },
    { key: 'may',   label: 'Май 2026' },
    { key: 'april', label: 'Апрель 2026' }
  ];
  var chips = months.map(function(m){
    var cls = 'report-chip' + (m.key === month ? ' active' : '');
    return '<button class="' + cls + '" data-month="' + m.key + '">' + m.label + '</button>';
  }).join('');
  var body;
  if (month === 'july') body = renderReportsJuly();
  else if (month === 'april') body = renderReportsApril();
  else if (month === 'may') body = renderReportsMay();
  else body = renderReportsJune();
  return '<div class="report-month-switch">' + chips + '</div>' +
         '<div class="report-body">' + body + '</div>';
}
